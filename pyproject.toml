[project]
name = "devteam-skills-mcp"
version = "0.1.0"
description = "DevTeam Skills MCP Server: fuente única de verdad de skills de desarrollo (superpowers, my_skills, modern-web-guidance)"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.2.4,<5",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "pyyaml>=6.0.2,<7",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "types-PyYAML>=6.0.12",
]

[project.scripts]
devteam-skills-mcp = "mcp_server.server:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "eval: retrieval quality evaluations against the real synced skills corpus",
]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
warn_unused_ignores = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "scripts", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]
"examples/**" = ["S105", "S106"]
