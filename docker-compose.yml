services:
  devteam-skills-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${PORT:-8000}:${PORT:-8000}"
    env_file:
      - path: .env
        required: false
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      PORT: ${PORT:-8000}
      MCP_PATH: ${MCP_PATH:-/mcp}
      SKILLS_DIR: /app/skills_store
      ROLES_CONFIG_PATH: /app/config/roles.yaml
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    # Descomentá para desarrollo local usando tu skills_store sincronizado en el host:
    # volumes:
    #   - ./skills_store:/app/skills_store:ro
    #   - ./config/roles.yaml:/app/config/roles.yaml:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
